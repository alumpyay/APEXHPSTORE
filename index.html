<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch') || Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
          if (!desc || !desc.set) {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return currentFetch;
              },
              set: function(newFetch) {
                currentFetch = newFetch;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          console.warn('Window fetch patch warning:', e);
        }
      })();
    </script>
